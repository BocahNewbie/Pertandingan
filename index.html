<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Info & Manajemen Pertandingan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- Header Utama -->
    <header class="header-area">
      <h1>🏆 Info & Manajemen Turnamen</h1>
      <button id="admin-toggle-btn" class="btn-admin" onclick="toggleAdminPanel()">
        🔒 Login Admin
      </button>
    </header>

    <!-- Modal Popup Login Modern -->
    <div id="login-modal" class="modal-overlay" style="display: none;">
      <div class="modal-card">
        <h3>🔐 Login Admin</h3>
        <p>Silakan masukkan kredensial untuk mengakses panel kontrol.</p>
        
        <div class="input-group">
          <label for="admin-user">Username:</label>
          <input type="text" id="admin-user" placeholder="Masukkan username">
        </div>

        <div class="input-group">
          <label for="admin-pass">Password:</label>
          <input type="password" id="admin-pass" placeholder="Masukkan password">
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeLoginModal()">Batal</button>
          <button type="button" class="btn-submit" onclick="processLogin()">Masuk</button>
        </div>
      </div>
    </div>

    <!-- Navigasi Tab -->
    <nav class="tabs" role="tablist" aria-label="Navigasi Turnamen">
      <button class="tab-btn active" role="tab" aria-selected="true" aria-controls="jadwal" onclick="openTab(event, 'jadwal')">
        📅 Jadwal Pertandingan
      </button>
      <button class="tab-btn" role="tab" aria-selected="false" aria-controls="hasil" onclick="openTab(event, 'hasil')">
        🏁 Hasil Pertandingan
      </button>
      <button class="tab-btn" role="tab" aria-selected="false" aria-controls="bagan" onclick="openTab(event, 'bagan')">
        🌳 Bagan Turnamen
      </button>
    </nav>

    <!-- Panel Admin -->
    <section id="admin-panel" class="admin-section" style="display: none;" aria-label="Panel Kontrol Admin">
      <div class="admin-header-panel">
        <h3>🛠️ Panel Kontrol Admin</h3>
        <button class="btn-logout" onclick="logoutAdmin()">Keluar (Logout)</button>
      </div>
      <div class="admin-card">
        <h4>Edit & Update Pertandingan</h4>
        
        <div class="form-group">
          <label for="match-select">Pilih Pertandingan:</label>
          <select id="match-select" onchange="onMatchSelectChange()">
            <option value="">-- Pilih Pertandingan --</option>
            <option value="SF1">Semifinal 1</option>
            <option value="SF2">Semifinal 2</option>
            <option value="F">Final</option>
          </select>
        </div>

        <div class="input-group">
          <label for="admin-tim1">Nama Tim 1:</label>
          <input type="text" id="admin-tim1" placeholder="Nama Tim 1">
        </div>

        <div class="input-group">
          <label for="admin-tim2">Nama Tim 2:</label>
          <input type="text" id="admin-tim2" placeholder="Nama Tim 2">
        </div>

        <div class="input-group">
          <label for="admin-tanggal">Tanggal & Jam:</label>
          <input type="text" id="admin-tanggal" placeholder="Contoh: Minggu, 4 Okt - 19:00">
        </div>

        <div class="input-group">
          <label for="admin-status">Status:</label>
          <select id="admin-status" onchange="toggleScoreInput()">
            <option value="Mendatang">Mendatang</option>
            <option value="Live">Live</option>
            <option value="Selesai">Selesai</option>
          </select>
        </div>

        <div class="skor-group" id="skor-input-area" style="display: none;">
          <div class="input-group">
            <label for="admin-skor1">Skor Tim 1:</label>
            <input type="number" id="admin-skor1" min="0" value="0">
          </div>
          <div class="input-group">
            <label for="admin-skor2">Skor Tim 2:</label>
            <input type="number" id="admin-skor2" min="0" value="0">
          </div>
        </div>

        <button type="button" class="btn-save" onclick="saveMatchData()">
          💾 Simpan Perubahan
        </button>
      </div>
    </section>

    <!-- Konten Tab User View -->
    <main class="content-area">
      <!-- Tab Jadwal -->
      <section id="jadwal" class="tab-content active" role="tabpanel">
        <div id="jadwal-container" class="card-grid">
          <p class="loading">Memuat jadwal...</p>
        </div>
      </section>

      <!-- Tab Hasil -->
      <section id="hasil" class="tab-content" role="tabpanel">
        <div id="hasil-container" class="card-grid">
          <p class="loading">Memuat hasil pertandingan...</p>
        </div>
      </section>

      <!-- Tab Bagan -->
      <section id="bagan" class="tab-content" role="tabpanel">
        <div id="bagan-container" class="bracket-view">
          <p class="loading">Memuat bagan...</p>
        </div>
      </section>
    </main>
  </div>

  <!-- Custom Alert/Popup Notifikasi -->
  <div id="custom-alert" class="custom-alert-overlay" style="display: none;">
    <div class="custom-alert-card" id="alert-card-box">
      <div id="alert-emoji" class="alert-emoji">✨</div>
      <h4 id="alert-title">Notifikasi</h4>
      <p id="alert-message">Pesan notifikasi...</p>
      <button class="btn-alert-ok" onclick="closeCustomAlert()">OK</button>
    </div>
  </div>

  <script src="javascript.js"></script>
</body>
</html>
