<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Jadwal Turnamen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header class="header-area">
      <h1>🏆 Manajemen Jadwal Turnamen</h1>
      <button id="admin-toggle-btn" class="btn-admin" onclick="toggleAdminLoginModal()">
        🔒 Login Admin
      </button>
    </header>

    <div id="login-modal" class="modal-overlay" style="display: none;">
      <div class="modal-card">
        <h3>🔐 Login Admin</h3>
        <p>Masukkan username dan password admin.</p>
        <div class="input-group">
          <label>Username:</label>
          <input type="text" id="admin-user" placeholder="admin">
        </div>
        <div class="input-group">
          <label>Password:</label>
          <input type="password" id="admin-pass" placeholder="123456">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeLoginModal()">Batal</button>
          <button type="button" class="btn-submit" onclick="processLogin()">Masuk</button>
        </div>
      </div>
    </div>

    <nav class="tabs" role="tablist">
      <button class="tab-btn active" role="tab" onclick="openTab(event, 'jadwal')">📅 Jadwal Pertandingan</button>
      <button class="tab-btn" role="tab" onclick="openTab(event, 'hasil')">🏁 Hasil Selesai</button>
      <button id="admin-tab-btn" class="tab-btn admin-tab" role="tab" onclick="openTab(event, 'admin-panel')" style="display: none;">🛠️ Panel Admin</button>
    </nav>

    <main class="content-area">
      <section id="jadwal" class="tab-content active" role="tabpanel">
        <div id="jadwal-container" class="card-grid"></div>
      </section>

      <section id="hasil" class="tab-content" role="tabpanel">
        <div id="hasil-container" class="card-grid"></div>
      </section>

      <section id="admin-panel" class="tab-content" role="tabpanel">
        <div class="admin-panel-wrapper">
          <div class="admin-header-panel">
            <h3>🛠️ Kontrol Administrator</h3>
            <button class="btn-logout" onclick="logoutAdmin()">Keluar</button>
          </div>

          <div class="admin-card">
            <h4>1️⃣ Manajemen Tim & Pemain</h4>
            <div class="input-group">
              <label>Nama Tim:</label>
              <input type="text" id="new-team-name" placeholder="Contoh: Tim Garuda">
            </div>
            <div class="input-group">
              <label>Daftar Pemain (Opsional):</label>
              <div id="player-inputs-container" class="player-inputs-container"></div>
              <button type="button" class="btn-secondary" onclick="addPlayerInput()" style="margin-top: 6px;">➕ Tambah Kolom Pemain</button>
            </div>
            <button type="button" class="btn-save" onclick="addTeam()" style="margin-top: 10px; width: 100%;">💾 Simpan Tim</button>
            
            <div style="margin-top: 15px;">
              <label style="font-weight: 600; font-size: 0.9rem; margin-bottom: 5px; display: block;">Tim Terdaftar:</label>
              <div id="team-list-admin" class="team-chips-container"></div>
            </div>
          </div>

          <div class="admin-card" style="margin-top: 20px;">
            <h4>2️⃣ Buat Jadwal Pertemuan Tim</h4>
            <div class="input-group">
              <label>Nama Babak / Laga (Contoh: Semifinal 1, Perempat Final):</label>
              <input type="text" id="match-round" placeholder="Contoh: Semifinal 1">
            </div>
            <div class="input-group">
              <label>Pilih Tim 1:</label>
              <select id="match-team1" onchange="updateTeamSelectOptions()"></select>
            </div>
            <div class="input-group">
              <label>Pilih Tim 2:</label>
              <select id="match-team2" onchange="updateTeamSelectOptions()"></select>
            </div>
            <!-- Kalender & Jam Dipisah -->
            <div class="input-group" style="display: flex; gap: 10px;">
              <div style="flex: 1;">
                <label>Tanggal (Kalender):</label>
                <input type="date" id="match-date" style="width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px;">
              </div>
              <div style="flex: 1;">
                <label>Jam:</label>
                <input type="time" id="match-time" style="width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px;">
              </div>
            </div>
            <button type="button" class="btn-save" onclick="createBracketMatch()" style="width: 100%; margin-top: 10px;">➕ Tambahkan ke Jadwal</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="custom-alert" class="custom-alert-overlay" style="display: none;">
    <div class="custom-alert-card" id="alert-card-box">
      <div id="alert-emoji" class="alert-emoji">✨</div>
      <h4 id="alert-title">Notifikasi</h4>
      <p id="alert-message">Pesan...</p>
      <button class="btn-alert-ok" onclick="closeCustomAlert()">OK</button>
    </div>
  </div>

  <script src="javascript.js"></script>
</body>
</html>
