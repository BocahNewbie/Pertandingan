<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Info & Manajemen Turnamen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- Header Utama -->
    <header class="header-area">
      <h1>🏆 Info & Manajemen Turnamen</h1>
      <button id="admin-toggle-btn" class="btn-admin" onclick="toggleAdminLoginModal()">
        🔒 Login Admin
      </button>
    </header>

    <!-- Modal Popup Login Modern -->
    <div id="login-modal" class="modal-overlay" style="display: none;">
      <div class="modal-card">
        <h3>🔐 Login Admin</h3>
        <p>Silakan masukkan kredensial untuk mengakses panel admin.</p>
        
        <div class="input-group">
          <label for="admin-user">Username:</label>
          <input type="text" id="admin-user" placeholder="Masukkan username">
        </div>

        <div class="input-group">
          <label for="admin-pass">Password:</label>
          <input type="password" id="admin-pass" placeholder="Masukkan password">
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeLoginModal()">Batal</button>
          <button type="button" class="btn-submit" onclick="processLogin()">Masuk</button>
        </div>
      </div>
    </div>

    <!-- Navigasi Tab Utama -->
    <nav class="tabs" role="tablist" aria-label="Navigasi Turnamen">
      <button class="tab-btn active" role="tab" aria-selected="true" onclick="openTab(event, 'jadwal')">
        📅 Jadwal Pertandingan
      </button>
      <button class="tab-btn" role="tab" aria-selected="false" onclick="openTab(event, 'hasil')">
        🏁 Hasil Pertandingan
      </button>
      <button class="tab-btn" role="tab" aria-selected="false" onclick="openTab(event, 'bagan')">
        🌳 Bagan Turnamen
      </button>
      <button id="admin-tab-btn" class="tab-btn admin-tab" role="tab" aria-selected="false" onclick="openTab(event, 'admin-panel')" style="display: none;">
        🛠️ Panel Admin
      </button>
    </nav>

    <!-- Konten Tab -->
    <main class="content-area">
      <!-- Tab Jadwal -->
      <section id="jadwal" class="tab-content active" role="tabpanel">
        <div id="jadwal-container" class="card-grid">
          <p class="loading">Memuat jadwal...</p>
        </div>
      </section>

      <!-- Tab Hasil -->
      <section id="hasil" class="tab-content" role="tabpanel">
        <div id="hasil-container" class="card-grid">
          <p class="loading">Memuat hasil pertandingan...</p>
        </div>
      </section>

      <!-- Tab Bagan -->
      <section id="bagan" class="tab-content" role="tabpanel">
        <div id="bagan-container" class="bracket-view">
          <p class="loading">Memuat bagan...</p>
        </div>
      </section>

      <!-- Tab Panel Admin Terpisah -->
      <section id="admin-panel" class="tab-content" role="tabpanel">
        <div class="admin-panel-wrapper">
          <div class="admin-header-panel">
            <h3>🛠️ Panel Kontrol Administrator</h3>
            <button class="btn-logout" onclick="logoutAdmin()">Keluar (Logout)</button>
          </div>
          
          <!-- Pendaftaran Tim & Pemain -->
          <div class="admin-card" style="margin-bottom: 20px; background: #fffdf0;">
            <h4>👥 Pendaftaran Tim & Pemain</h4>
            
            <div class="input-group">
              <label for="new-team-name">Nama Tim:</label>
              <input type="text" id="new-team-name" placeholder="Masukkan nama tim...">
            </div>

            <div class="input-group">
              <label>Daftar Pemain (Opsional):</label>
              <div id="player-inputs-container" class="player-inputs-container"></div>
              <button type="button" class="btn-secondary" onclick="addPlayerInput()" style="margin-top: 8px;">➕ Tambah Kolom Pemain</button>
            </div>

            <button type="button" class="btn-save" onclick="addTeam()" style="margin-top: 10px; width: 100%;">💾 Simpan Tim & Pemain</button>
            
            <div style="margin-top: 15px;">
              <label style="font-size: 0.9rem; font-weight: 600; margin-bottom: 5px; display: block;">Daftar Tim Terdaftar:</label>
              <div id="team-list-admin" class="team-chips-container"></div>
            </div>

            <button type="button" class="btn-danger" onclick="generateBracket()" style="margin-top: 15px; width: 100%;">🔄 Generate Jadwal & Bagan Dinamis</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Custom Alert/Popup Notifikasi -->
  <div id="custom-alert" class="custom-alert-overlay" style="display: none;">
    <div class="custom-alert-card" id="alert-card-box">
      <div id="alert-emoji" class="alert-emoji">✨</div>
      <h4 id="alert-title">Notifikasi</h4>
      <p id="alert-message">Pesan notifikasi...</p>
      <button class="btn-alert-ok" onclick="closeCustomAlert()">OK</button>
    </div>
  </div>

  <script src="javascript.js"></script>
</body>
</html>
